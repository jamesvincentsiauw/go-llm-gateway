listen: ":8080"
redis_url: redis://localhost:6379/0
stall_timeout: 60s          # max silence from an upstream, including while a model thinks
default_max_tokens: 4096
max_tokens_limit: 64000
breaker:
  failures: 3               # consecutive failures before a provider is skipped
  cooldown: 30s

providers:
  - name: claude
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    refusal_fallbacks: true   # let the Claude API re-run declined requests on its recommended fallback model
  - name: secondary
    type: openai              # any server that speaks the OpenAI chat completions API
    base_url: https://api.example.com/v1
    api_key_env: SECONDARY_API_KEY

routes:
  - model: default            # the model name clients send
    targets:
      - {provider: claude, model: claude-opus-5}
      - {provider: secondary, model: your-model-id}

clients:
  - name: backend
    key_env: GATEWAY_KEY_BACKEND
    daily_token_limit: 2000000
  - name: internal-tools
    key_env: GATEWAY_KEY_TOOLS
    daily_token_limit: 0        # 0 means unlimited
